name: Build APK Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil Source Code
      uses: actions/checkout@v4

    - name: 2. Setup Java 17 (Wajib untuk Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Install Pendukung Utama & Auto Accept SDK Licenses
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip python3-pip cmake libffi-dev libssl-dev
        sudo apt-get install -y aidl
        pip install --upgrade buildozer cython virtualenv
        
        # Trik Kunci: Mengisi persetujuan lisensi Android secara otomatis ke dalam sistem GitHub 
        # Sebelum Buildozer sempat mendownloadnya, jadi lisensi versi 37 otomatis dianggap sah.
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        
    - name: 4. Build APK dengan Kunci Otomatis Lisensi
      env:
        # Memaksa Buildozer menerima semua lisensi SDK di latar belakang tanpa bertanya (y/N)
        ANDROID_NOT_UNATTENDED: 1
        AUTO_ACCEPT_AND_SDK_LICENSES: 1
      run: |
        # Kita jalankan buildozer secara murni. Biarkan dia mendownload sdkmanager-nya sendiri
        # tanpa kita ganggu foldernya di awal, sehingga eror 'not installed' tidak akan muncul.
        buildozer android debug

    - name: 5. Upload APK ke Hasil Akhir
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

name: Build APK Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # ← Lebih stabil dari ubuntu-latest

    steps:
    - name: 1. Ambil Source Code
      uses: actions/checkout@v4

    - name: 2. Setup Java 17 (Wajib untuk Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Install Pendukung Utama
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          python3-pip \
          cmake libffi-dev libssl-dev \
          libtool-bin autoconf automake pkg-config libltdl-dev \
          g++-multilib lib32z1 \
          adb
        pip install --upgrade buildozer cython virtualenv

    - name: 4. Install Android cmdline-tools (sdkmanager)
      run: |
        # Download cmdline-tools resmi dari Google
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
             -O cmdtools.zip

        # Ekstrak ke lokasi yang benar
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
        unzip -q cmdtools.zip -d /tmp/cmdtools-tmp
        mv /tmp/cmdtools-tmp/cmdline-tools \
           $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest

        # Tambahkan ke PATH
        echo "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" \
             >> $GITHUB_PATH
        echo "$HOME/.buildozer/android/platform/android-sdk/platform-tools" \
             >> $GITHUB_PATH

    - name: 5. Accept Lisensi & Install SDK Components
      env:
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      run: |
        SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

        # Accept semua lisensi otomatis
        yes | $SDKMANAGER --licenses

        # Install komponen SDK yang dibutuhkan buildozer
        $SDKMANAGER \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "ndk;25.2.9519653"

        echo "=== SDK & NDK Berhasil Diinstall ==="

    - name: 6. Build APK
      env:
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk/ndk/25.2.9519653
      run: |
        buildozer android debug

    - name: 7. Upload APK ke Hasil Akhir
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

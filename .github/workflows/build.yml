name: Build APK Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil Source Code
      uses: actions/checkout@v4

    - name: 2. Setup Java 17 (Wajib untuk Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Install Pendukung Utama & Suntik Tanda Tangan Lisensi
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip python3-pip cmake libffi-dev libssl-dev
        sudo apt-get install -y aidl g++-multilib lib32z1
        pip install --upgrade buildozer cython virtualenv
        
        # MEMBUAT SURAT TANDA TANGAN LISENSI DIGITAL (PRE-ACCEPT)
        # Kita buat foldernya duluan secara paksa
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        
        # Kita suntik kode enkripsi lisensi resmi Google (termasuk versi 37) langsung ke dalam file teks
        echo -e "247c7ccb60f8da5643a2b1ddb477d490084c3059\n28a9478d6c522d87ac77416e4179e354737d2f9d" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        
        echo "=== Tanda Tangan Lisensi Google Berhasil Disuntikkan! ==="

    - name: 4. Build APK Murni (Bebas Pertanyaan y/N)
      run: |
        # Jalankan buildozer secara murni tanpa embel-embel 'yes |' karena lisensinya sudah sah di dalam folder
        buildozer android debug

    - name: 5. Upload APK ke Hasil Akhir
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

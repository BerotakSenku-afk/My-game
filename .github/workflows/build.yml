name: Build Android APK dengan Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Ambil Source Code dari Repo
      uses: actions/checkout@v4

    - name: 2. Setup Java JDK 17 (Wajib untuk Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Install Pendukung Kompiler & Aidl Resmi Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip python3-pip cmake libffi-dev libssl-dev
        sudo apt-get install -y aidl
        sudo pip3 install --upgrade buildozer cython virtualenv

    - name: 4. Pancing Buildozer untuk Download SDK & NDK
      run: |
        # Perintah pancingan agar Buildozer mendownload sdkmanager & NDK secara normal tanpa eror folder kosong
        buildozer android google_snyk || true
        buildozer android platform || true

    - name: 5. Suntik Paksa Jalur Aidl ke Tempat yang Benar
      run: |
        # Setelah sdkmanager aman terinstal, baru kita buatkan folder target versi 33
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.1/
        # Pasang jalan pintas file aidl bawaan Ubuntu ke jantung folder Buildozer
        ln -sf /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/33.0.1/aidl
        # Salin juga ke folder build-tools utama sebagai cadangan keamanan
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/
        ln -sf /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/aidl || true

    - name: 6. Mulai Kompilasi Akhir APK Game
      run: |
        buildozer android debug

    - name: 7. Upload APK ke Hasil Akhir (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

name: Build APK Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil Source Code
      uses: actions/checkout@v4

    - name: 2. Setup Java 17 (Wajib untuk Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Install Pendukung Utama (Anti Aidl Error)
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip python3-pip cmake libffi-dev libssl-dev
        sudo apt-get install -y aidl g++-multilib lib32z1
        pip install --upgrade buildozer cython virtualenv

    - name: 4. Pancing SDK & Tembak Manual Semua Lisensi Google
      run: |
        # Langkah A: Pancing Buildozer membuat folder SDK resmi miliknya sendiri (Biar tidak sdkmanager not found)
        buildozer android platform || true
        
        # Langkah B: Cara Manual Accept License!
        # Kita cari di mana letak sdkmanager buatan Buildozer, lalu kita paksa ketik 'yes' untuk semua lisensinya
        echo "=== Menyetujui Lisensi Google Secara Manual ==="
        yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

    - name: 5. Mulai Kompilasi Akhir APK Game
      run: |
        # Sekarang lisensi sudah ditandatangani manual di Langkah 4, tinggal jalankan sampai jadi APK
        buildozer android debug

    - name: 6. Upload APK ke Hasil Akhir
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

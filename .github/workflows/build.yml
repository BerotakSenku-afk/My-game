name: Kapsul Buildozer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil Source Code
      uses: actions/checkout@v4

    - name: 2. Masukkan ke Mesin Kapsul Buildozer (Otomatis)
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        command: buildozer android debug
        buildozer_version: master

    - name: 3. Upload APK ke Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

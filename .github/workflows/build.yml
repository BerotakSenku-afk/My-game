name: Build APK Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil Source Code
      uses: actions/checkout@v4

    - name: 2. Setup Java 17 (Wajib untuk Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Install Pendukung & Pustaka Arsitektur (Anti Aidl Error)
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip python3-pip cmake libffi-dev libssl-dev
        sudo apt-get install -y aidl g++-multilib lib32z1
        pip install --upgrade buildozer cython virtualenv

    - name: 4. Build APK Secara Bersih
      run: |
        # Jalankan buildozer secara normal tanpa pancingan 'yes' agar tidak terkena broken pipe
        buildozer android debug

    - name: 5. Upload APK ke Hasil Akhir
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

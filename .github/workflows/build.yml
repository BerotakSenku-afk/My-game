name: Build APK Game

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60  # ← Tambah timeout eksplisit

    steps:
    - name: 1. Ambil Source Code
      uses: actions/checkout@v4

    - name: 2. Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Cache Buildozer & Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: 4. Install Pendukung Utama
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip python3-pip \
          cmake libffi-dev libssl-dev \
          libtool-bin autoconf automake pkg-config libltdl-dev \
          g++-multilib lib32z1
        pip install --upgrade buildozer cython virtualenv

    - name: 5. Install Android cmdline-tools
      run: |
        # Skip kalau sudah ada di cache
        if [ ! -f "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
               -O cmdtools.zip
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          unzip -q cmdtools.zip -d /tmp/cmdtools-tmp
          mv /tmp/cmdtools-tmp/cmdline-tools \
             $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        fi
        echo "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/.buildozer/android/platform/android-sdk/platform-tools" >> $GITHUB_PATH

    - name: 6. Accept Lisensi & Install SDK
      env:
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      run: |
        SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        yes | $SDKMANAGER --licenses
        $SDKMANAGER \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "ndk;25.2.9519653"

    - name: 7. Build APK
      env:
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk/ndk/25.2.9519653
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-sdk/ndk/25.2.9519653
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      run: |
        unset ANDROID_NDK_HOME || true
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
        ln -sf \
          $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        buildozer -v android debug 2>&1 | tee build.log

    - name: 8. Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Game

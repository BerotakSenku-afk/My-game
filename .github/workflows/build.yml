name: Build Android APK dengan Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Ambil Source Code dari Repo
      uses: actions/checkout@v4

    - name: 2. Setup Java JDK 17 (Wajib untuk Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Install Pendukung Kompiler & Aidl Resmi Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip python3-pip cmake libffi-dev libssl-dev
        sudo apt-get install -y aidl
        sudo pip3 install --upgrade buildozer cython virtualenv

    - name: 4. Jalankan Kompilasi & Suntik Aidl Otomatis di Latar Belakang
      run: |
        # Membuat skrip pemantau latar belakang agar mendeteksi kapan folder build-tools tercipta oleh Buildozer
        (
          echo "=== Pemantau Latar Belakang Aktif ==="
          while [ ! -d "$HOME/.buildozer/android/platform/android-sdk/build-tools" ]; do
            sleep 2
          done
          echo "=== Folder SDK Terdeteksi! Menunggu Pembuatan Folder Versi ==="
          sleep 10
          
          # Membuat folder versi target dan menaruh link aidl secara paksa di tengah jalan
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.1/
          ln -sf /usr/bin/aidl $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.1/aidl
          echo "=== File Aidl Berhasil Disuntikkan Secara Paksa! ==="
        ) &
        
        # Jalankan perintah perakitan APK utama
        buildozer android debug

    - name: 5. Upload APK ke Hasil Akhir (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

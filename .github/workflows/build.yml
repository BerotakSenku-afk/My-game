name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Konten Repositori
      uses: actions/checkout@v4

    - name: Set Up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set Up Android SDK Otomatis (Solusi Permanen Aidl)
      uses: android-actions/setup-android@v3

    - name: Ambil Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install Dependencies & Alat Kompiler
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip python3-pip cmake libffi-dev libssl-dev
        sudo pip3 install --upgrade buildozer cython virtualenv

    - name: Setujui Semua Lisensi Android SDK
      run: |
        yes | sdkmanager --licenses || true

    - name: Proses Kompilasi APK (Buildozer Debug)
      run: |
        buildozer android debug

    - name: Upload Hasil File APK ke GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

name: Build Android APK dengan Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Ambil Source Code dari Repo
      uses: actions/checkout@v4

    - name: 2. Setup Java JDK 17 (Wajib untuk Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Install Android SDK & Aidl Resmi (Metode Google Colab)
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip python3-pip cmake libffi-dev libssl-dev
        # Pasang aidl bawaan linux ubuntu
        sudo apt-get install -y aidl
        sudo pip3 install --upgrade buildozer cython virtualenv
        
        # Download cmdline-tools untuk menginstal SDK secara manual
        mkdir -p $HOME/android-cmdline
        curl -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q cmdline.zip -d $HOME/android-cmdline
        
        # Jalankan sdkmanager untuk download build-tools 33.0.1 secara mandiri
        yes | $HOME/android-cmdline/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses
        $HOME/android-cmdline/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "build-tools;33.0.1" "platforms;android-33"
        
        # Suntik file aidl asli ke dalam SDK yang baru didownload
        ln -sf /usr/bin/aidl $HOME/android-sdk/build-tools/33.0.1/aidl

    - name: 4. Paksa Buildozer Memakai SDK yang Sudah Kita Siapkan
      run: |
        # Buat folder rahasia Buildozer dan arahkan (symlink) ke SDK resmi yang sudah lengkap ada aidl-nya
        mkdir -p $HOME/.buildozer/android/platform/
        ln -sf $HOME/android-sdk $HOME/.buildozer/android/platform/android-sdk
        
        # Jalankan perakitan APK
        buildozer android debug

    - name: 5. Upload APK ke Hasil Akhir (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Konten Repositori
      uses: actions/checkout@v4

    - name: Ambil Cache Buildozer (Biar Build Selanjutnya Cepat)
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install Dependencies & Alat Kompiler
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip cmake libffi-dev libssl-dev
        sudo pip3 install --upgrade buildozer cython virtualenv

    - name: Setujui Lisensi Android SDK & Paksa Instal Aidl
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Menggunakan sdkmanager bawaan GitHub Actions secara presisi
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        # Paksa sistem menginstal build-tools agar file aidl langsung tersedia
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.1"
        # Daftarkan build-tools ke sistem agar Buildozer bisa langsung memanggil aidl
        echo "$ANDROID_HOME/build-tools/33.0.1" >> $GITHUB_PATH

    - name: Proses Kompilasi APK (Buildozer Debug)
      run: |
        buildozer android debug

    - name: Upload Hasil File APK ke GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk

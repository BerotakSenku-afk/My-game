name: Build Android APK dengan Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Ambil Source Code dari Repo
      uses: actions/checkout@v4

    - name: 2. Setup Java JDK 17 (Wajib untuk Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Install Pendukung Kompiler & File Aidl Resmi Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool-bin ccache autoconf automake pkg-config libltdl-dev
        sudo apt-get install -y git zip unzip python3-pip cmake libffi-dev libssl-dev
        # Mengunduh paket aidl bawaan Linux agar pasti ada di server
        sudo apt-get install -y aidl
        sudo pip3 install --upgrade buildozer cython virtualenv

    - name: 4. Buat Folder Tujuan & Suntik Paksa Jalur Aidl
      run: |
        # Membuat folder target build-tools Buildozer secara paksa sebelum dia mulai download
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.1/
        # Membuat jalan pintas (symlink) agar saat Buildozer mencari aidl, dia otomatis diarahkan ke file aidl bawaan Ubuntu
        ln -sf /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/33.0.1/aidl
        # Cek apakah jalan pintasnya berhasil terpasang
        ls -la ~/.buildozer/android/platform/android-sdk/build-tools/33.0.1/

    - name: 5. Mulai Kompilasi APK Game
      run: |
        buildozer android debug

    - name: 6. Upload APK ke Hasil Akhir (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Siap-Instal
        path: bin/*.apk
